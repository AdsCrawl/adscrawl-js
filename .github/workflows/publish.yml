name: Publish to npm
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check release ref
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const { GITHUB_EVENT_NAME, GITHUB_REF, GITHUB_REF_NAME } = process.env;
          if (GITHUB_EVENT_NAME === 'push' && GITHUB_REF !== `refs/tags/v${version}`) {
            throw new Error(`Release tag must be v${version}`);
          }
          if (GITHUB_EVENT_NAME === 'workflow_dispatch' && GITHUB_REF !== 'refs/heads/main' && GITHUB_REF !== `refs/tags/v${version}`) {
            throw new Error('Manual publishing requires main or the matching version tag');
          }
          console.log(`Publishing adscrawl@${version} from ${GITHUB_REF_NAME}`);
          NODE
      - name: Check npm supports trusted publishing
        run: |
          node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) throw new Error("npm 11.5.1+ is required")' "$(npm --version)"
      - run: npm ci
      - run: npm run check
      - run: npm run test:package
      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          # Bootstrap the first release with a granular token. After configuring
          # npm Trusted Publisher, delete this secret; npm will use OIDC instead.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
